server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/service2db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317

opentelemetry:
  traces:
    exporter: otlp

  metrics:
    exporter: otlp

  logs:
    exporter: otlp

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

message:
  greeting: Welcome To Service 2