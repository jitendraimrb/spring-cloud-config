server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/service1db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    instances:
      service2CB:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-size: 10

  retry:
    instances:
      service2CB:
        max-attempts: 3
        wait-duration: 2s

  timelimiter:
    instances:
      service2CB:
        timeout-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317

opentelemetry:
  traces:
    exporter: otlp

  metrics:
    exporter: otlp

  logs:
    exporter: otlp

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId}]"

message:
  greeting: Welcome To Service 1